<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Ringo · 照片编配听评</title>
<style>
  :root { color-scheme:light; font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f0e8; color:#28251f; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-size:14px; }
  main { width:min(1120px,100%); margin:auto; padding:36px 24px 64px; }
  header { border-bottom:1px solid #d9d3c4; padding-bottom:20px; margin-bottom:20px; }
  h1,h2,h3,p { margin:0; }
  h1 { font-size:clamp(27px,5vw,42px); font-weight:650; letter-spacing:-.045em; }
  h2 { font-size:19px; }
  h3 { font-size:16px; overflow-wrap:anywhere; }
  .layout { display:grid; grid-template-columns:minmax(250px,308px) minmax(0,1fr); gap:16px; align-items:start; }
  .stack { display:grid; gap:12px; min-width:0; }
  .panel { min-width:0; background:#fffcf6; border:1px solid #ded7c9; border-radius:14px; padding:17px; }
  .muted,.status { color:#665b49; font-size:13px; line-height:1.55; overflow-wrap:anywhere; }
  .status:empty { display:none; }
  .error { color:#8c3325; }
  label { display:grid; gap:5px; min-width:0; }
  input,select,textarea,button { font:inherit; color:inherit; }
  input:not([type=checkbox]),select,textarea { width:100%; min-width:0; padding:7px; border:1px solid #cfc7b7; border-radius:6px; background:#fffefa; }
  input[type=checkbox] { accent-color:#705831; }
  textarea { resize:vertical; }
  button { padding:7px 10px; background:#fffefa; border:1px solid #c8bda8; border-radius:7px; cursor:pointer; }
  button[aria-pressed=true] { background:#eee7d7; border-color:#776240; }
  button.primary { background:#332c20; color:#fffcf6; border-color:#332c20; }
  button:disabled { opacity:.58; cursor:default; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .library { display:grid; gap:5px; max-height:325px; overflow:auto; }
  .library button { display:flex; text-align:left; align-items:center; gap:8px; min-width:0; padding:4px 7px; }
  .library button span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .library img { width:40px; height:32px; object-fit:cover; border-radius:4px; background:#e5dfd3; flex:none; }
  .preview { display:block; width:100%; max-height:340px; border-radius:9px; object-fit:contain; background:#e5dfd3; }
  .candidates { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .candidate { min-width:0; display:grid; gap:9px; border:1px solid #ded7c9; border-radius:9px; padding:10px; }
  .candidate strong { font-size:19px; }
  audio { display:block; width:100%; height:35px; }
  .scores { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; font-size:12px; }
  .check { display:flex; align-items:center; gap:5px; font-size:13px; }
  summary { cursor:pointer; }
  details p { padding-top:7px; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } .library { max-height:155px; } }
  @media (max-width:460px) { main { padding:24px 12px 40px; } .candidates { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header><h1>Ringo 照片编配听评</h1></header>
  <div class="layout">
    <aside class="panel stack" aria-labelledby="library-heading">
      <h2 id="library-heading">评分库</h2>
      <label for="library-file">导入完整听评库 ZIP</label>
      <input type="file" id="library-file" accept=".zip,application/zip">
      <p class="muted">选择含原图和 MP3 的 ZIP，文件在当前浏览器读取。</p>
      <p class="status" id="import-status" role="status"></p>
      <div class="stack" id="library-controls" hidden>
        <label>评审名<input id="rater" value="本机评审" maxlength="48" autocomplete="off"></label>
        <div class="actions" role="group" aria-label="筛选照片">
          <button id="pending" type="button" aria-pressed="true">待评</button>
          <button id="all" type="button" aria-pressed="false">全部</button>
        </div>
        <p class="status" id="count" role="status"></p>
        <div class="library" id="photos" aria-label="照片列表"></div>
        <div class="actions"><button id="export" type="button">导出我的评分 JSONL</button></div>
      </div>
    </aside>
    <section class="panel stack" aria-labelledby="listen-heading">
      <h2 id="listen-heading">盲听与评分</h2>
      <p class="muted" id="empty">导入 ZIP 后，选一张照片开始听评。</p>
      <p class="status" id="saved-status" role="status"></p>
      <div class="stack" id="detail" hidden>
        <h3 id="photo-name" tabindex="-1"></h3>
        <img id="photo" class="preview" alt="当前照片">
        <div id="review"></div>
      </div>
    </section>
  </div>
</main>
<script type="module" src="./review.js"></script>
</body>
</html>
