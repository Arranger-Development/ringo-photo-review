<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://*.aliyuncs.com; img-src 'self' blob:; media-src 'self' blob:; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Ringo · 照片编配听评</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="masthead">
    <div class="brand">Ringo</div>
    <h1>照片编配听评</h1>
    <nav aria-label="工作模式">
      <a id="single-tab" href="?mode=single">单图验证</a>
      <a id="review-tab" href="?mode=review">批量听评</a>
    </nav>
  </header>
  <p id="fatal" class="error" hidden role="alert"></p>
  <section id="single" class="workspace" aria-label="单图验证">
    <aside class="panel controls">
      <form id="generate" class="stack">
        <h2>生成编配</h2>
        <label>百炼 API Key<input id="key" type="password" autocomplete="off" spellcheck="false" required></label>
        <label>选择一张照片<input id="photo-input" type="file" accept="image/jpeg,image/png" required></label>
        <label>候选套数<select id="count"><option selected>6</option><option>7</option><option>8</option></select></label>
        <details>
          <summary>百炼接入设置</summary>
          <label>Base URL<input id="endpoint" type="url" value="https://dashscope.aliyuncs.com/compatible-mode/v1" spellcheck="false" required></label>
          <label>模型 ID<input id="model" value="qwen3.8-flash" required></label>
        </details>
        <button class="primary" id="generate-button" type="submit">生成试听</button>
      </form>
      <section class="stack library">
        <h2>我的生成记录</h2>
        <p class="muted" id="run-count"></p>
        <ul id="run-list"></ul>
        <button type="button" id="export-runs" disabled>下载完整编配 ZIP</button>
        <label class="file-action">导入听评结果 ZIP<input type="file" id="import-results" accept=".zip,application/zip"></label>
        <button type="button" id="export-merged" disabled>导出汇总评分 ZIP</button>
        <p role="status" id="single-status" class="status"></p>
      </section>
    </aside>
    <section class="panel card" aria-label="当前照片">
      <div id="single-empty" class="empty"><h2>选择一张照片开始</h2><p>生成后在这里试听各套编配，原图和调用记录会保存到当前浏览器。</p></div>
      <div id="single-detail" class="stack" hidden></div>
    </section>
  </section>

  <section id="review" class="workspace" aria-label="批量听评" hidden>
    <aside class="panel controls stack">
      <h2>导入编配</h2>
      <label>选择编配 ZIP<input id="import-deck" type="file" accept=".zip,application/zip"></label>
      <label id="deck-control" hidden>当前听评包<select id="deck-select"></select></label>
      <label>评审名<input id="rater" maxlength="48" autocomplete="off" placeholder="填写固定的名字"></label>
      <p role="status" id="review-status" class="status"></p>
      <div id="review-controls" class="stack library" hidden>
        <h2>听评进度</h2>
        <p id="review-progress" class="muted"></p>
        <label>跳到照片<select id="jump"></select></label>
        <button type="button" id="retry-renders" hidden>重试未合成的照片</button>
        <button type="button" class="primary" id="export-ratings" disabled>下载听评结果 ZIP</button>
      </div>
    </aside>
    <section class="panel card" aria-label="照片卡片">
      <div id="review-empty" class="empty"><h2>导入一份编配包</h2><p>浏览器会逐张合成试听。已有 MP3 的听评包也可以直接打开。</p></div>
      <div id="review-detail" class="stack" hidden></div>
    </section>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
